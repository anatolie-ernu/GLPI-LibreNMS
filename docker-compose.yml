name: ${COMPOSE_PROJECT_NAME:-glpi-librenms}

services:
  nginx-proxy-manager:
    image: ${NPM_IMAGE:-jc21/nginx-proxy-manager:latest}
    container_name: glpi-librenms-npm
    restart: unless-stopped
    environment:
      DISABLE_IPV6: ${NPM_DISABLE_IPV6:-true}
      DB_SQLITE_FILE: /data/database.sqlite
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    ports:
      - "${NPM_PROXY_BIND_IP:-0.0.0.0}:${NPM_HTTP_PORT:-80}:80"
      - "${NPM_PROXY_BIND_IP:-0.0.0.0}:${NPM_HTTPS_PORT:-443}:443"
      - "${NPM_ADMIN_BIND_IP:-127.0.0.1}:${NPM_ADMIN_PORT:-81}:81"
    networks:
      - proxy-net

  glpi-db:
    image: ${GLPI_DB_IMAGE:-mysql:8.4}
    container_name: glpi-db
    restart: unless-stopped
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${GLPI_DB_NAME}
      MYSQL_USER: ${GLPI_DB_USER}
      MYSQL_PASSWORD: ${GLPI_DB_PASSWORD}
    volumes:
      - glpi_db:/var/lib/mysql
    networks:
      - glpi-backend
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  glpi:
    image: ${GLPI_IMAGE:-glpi/glpi:11}
    container_name: glpi
    restart: unless-stopped
    depends_on:
      glpi-db:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      GLPI_DB_HOST: glpi-db
      GLPI_DB_PORT: 3306
      GLPI_DB_NAME: ${GLPI_DB_NAME}
      GLPI_DB_USER: ${GLPI_DB_USER}
      GLPI_DB_PASSWORD: ${GLPI_DB_PASSWORD}
      GLPI_CRONTAB_ENABLED: ${GLPI_CRONTAB_ENABLED:-1}
      GLPI_SKIP_AUTOINSTALL: ${GLPI_SKIP_AUTOINSTALL:-false}
      GLPI_SKIP_AUTOUPDATE: ${GLPI_SKIP_AUTOUPDATE:-false}
    volumes:
      - glpi_data:/var/glpi
    ports:
      - "${DIRECT_BIND_IP:-127.0.0.1}:${GLPI_HTTP_PORT:-8081}:80"
    networks:
      - glpi-backend
      - proxy-net
    labels:
      npm.expose: "true"
      npm.hostname: "${GLPI_HOSTNAME:-glpi}"
      npm.port: "80"
      npm.ssl: "false"
      npm.websockets: "false"

  librenms-db:
    image: ${LIBRENMS_DB_IMAGE:-mariadb:11.4}
    container_name: librenms-db
    restart: unless-stopped
    command:
      - mariadbd
      - --innodb-file-per-table=1
      - --lower-case-table-names=0
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: ${TZ}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${LIBRENMS_DB_NAME}
      MYSQL_USER: ${LIBRENMS_DB_USER}
      MYSQL_PASSWORD: ${LIBRENMS_DB_PASSWORD}
    volumes:
      - librenms_db:/var/lib/mysql
    networks:
      - librenms-backend
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  librenms-redis:
    image: ${REDIS_IMAGE:-redis:7.2-alpine}
    container_name: librenms-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - librenms_redis:/data
    networks:
      - librenms-backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  librenms:
    image: ${LIBRENMS_IMAGE:-librenms/librenms:latest}
    container_name: librenms
    hostname: librenms
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      librenms-db:
        condition: service_healthy
      librenms-redis:
        condition: service_healthy
    environment: &librenms_environment
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      DB_HOST: librenms-db
      DB_NAME: ${LIBRENMS_DB_NAME}
      DB_USER: ${LIBRENMS_DB_USER}
      DB_PASSWORD: ${LIBRENMS_DB_PASSWORD}
      DB_TIMEOUT: 60
      REDIS_HOST: librenms-redis
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      MEMORY_LIMIT: ${LIBRENMS_MEMORY_LIMIT:-512M}
      MAX_INPUT_VARS: ${LIBRENMS_MAX_INPUT_VARS:-2000}
      UPLOAD_MAX_SIZE: ${LIBRENMS_UPLOAD_MAX_SIZE:-32M}
      OPCACHE_MEM_SIZE: ${LIBRENMS_OPCACHE_MEM_SIZE:-256}
    volumes:
      - librenms_data:/data
    ports:
      - "${DIRECT_BIND_IP:-127.0.0.1}:${LIBRENMS_HTTP_PORT:-8000}:8000"
    networks:
      - librenms-backend
      - proxy-net
    labels:
      npm.expose: "true"
      npm.hostname: "${LIBRENMS_HOSTNAME:-librenms}"
      npm.port: "8000"
      npm.ssl: "false"
      npm.websockets: "true"

  librenms-dispatcher:
    image: ${LIBRENMS_IMAGE:-librenms/librenms:latest}
    container_name: librenms-dispatcher
    hostname: librenms-dispatcher
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      librenms:
        condition: service_started
      librenms-redis:
        condition: service_healthy
    environment:
      <<: *librenms_environment
      DISPATCHER_NODE_ID: dispatcher1
      SIDECAR_DISPATCHER: 1
    volumes:
      - librenms_data:/data
    networks:
      - librenms-backend

  docker-socket-proxy:
    image: ${SOCKET_PROXY_IMAGE:-tecnativa/docker-socket-proxy:latest}
    container_name: glpi-librenms-docker-socket-proxy
    restart: unless-stopped
    profiles:
      - auto-discovery
    environment:
      CONTAINERS: "1"
      NETWORKS: "1"
      INFO: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-net

  npm-auto-discovery:
    build:
      context: .
      dockerfile: Dockerfile.discovery
    container_name: glpi-librenms-npm-auto-discovery
    restart: unless-stopped
    profiles:
      - auto-discovery
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      NPM_API_URL: http://nginx-proxy-manager:81/api
      NPM_API_EMAIL: ${NPM_API_EMAIL}
      NPM_API_PASSWORD: ${NPM_API_PASSWORD}
      DOMAIN_NAME: ${DOMAIN_NAME}
      DISCOVERY_INTERVAL: ${DISCOVERY_INTERVAL:-300}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      nginx-proxy-manager:
        condition: service_started
      docker-socket-proxy:
        condition: service_started
    networks:
      - proxy-net
      - socket-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  proxy-net:
    driver: bridge
  glpi-backend:
    driver: bridge
    internal: true
  librenms-backend:
    driver: bridge
    internal: true
  socket-net:
    driver: bridge
    internal: true

volumes:
  npm_data:
  npm_letsencrypt:
  glpi_db:
  glpi_data:
  librenms_db:
  librenms_data:
  librenms_redis:
