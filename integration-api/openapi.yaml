openapi: 3.1.0
info:
  title: GLPI LibreNMS Integration API
  version: 0.2.0
  description: >-
    Internal API for correlating GLPI assets and Service Desk tickets with
    LibreNMS network state and alert/recovery events.
servers:
  - url: http://integration-api:8088
paths:
  /health:
    get:
      summary: Process health
      operationId: health
      responses:
        '200':
          description: Local process health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      summary: Upstream readiness
      operationId: ready
      responses:
        '200':
          description: GLPI and LibreNMS are reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: One or more upstream systems are unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/endpoints/by-ip/{ip}:
    get:
      summary: Resolve endpoint network location by IP
      operationId: endpointByIp
      security:
        - apiKey: []
      parameters:
        - name: ip
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Endpoint resolution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointResolution'
        '401':
          description: Invalid API key
        '404':
          description: Endpoint not found
        '422':
          description: Invalid IP address
  /v1/endpoints/by-mac/{mac}:
    get:
      summary: Resolve endpoint network location by MAC
      operationId: endpointByMac
      security:
        - apiKey: []
      parameters:
        - name: mac
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Endpoint resolution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointResolution'
        '401':
          description: Invalid API key
        '404':
          description: Endpoint not found
        '422':
          description: Invalid MAC address
  /v1/assets/{asset_id}/network:
    get:
      summary: Enrich a GLPI asset with LibreNMS network context
      operationId: assetNetwork
      security:
        - apiKey: []
      parameters:
        - name: asset_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Asset network context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetNetworkResponse'
        '401':
          description: Invalid API key
        '404':
          description: Asset or network evidence not found
  /v1/events/librenms:
    post:
      summary: Receive a LibreNMS alert/recovery event
      operationId: librenmsEvent
      security:
        - webhookSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibreNmsEvent'
      responses:
        '202':
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAccepted'
        '401':
          description: Invalid webhook authentication
        '422':
          description: Invalid payload
  /v1/correlations/{key}:
    get:
      summary: Get alert-to-ticket correlation state
      operationId: getCorrelation
      security:
        - apiKey: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Correlation state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Correlation'
        '401':
          description: Invalid API key
        '404':
          description: Correlation not found
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
    webhookSecret:
      type: apiKey
      in: header
      name: X-Webhook-Secret
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        librenms:
          type: string
          enum: [reachable, unreachable, unknown]
        glpi:
          type: string
          enum: [reachable, unreachable, unknown]
    DeviceRef:
      type: object
      properties:
        id:
          type: [integer, 'null']
        hostname:
          type: [string, 'null']
    PortRef:
      type: object
      properties:
        id:
          type: [integer, 'null']
        ifName:
          type: [string, 'null']
        status:
          type: [string, 'null']
        ifAlias:
          type: [string, 'null']
    EndpointResolution:
      type: object
      required: [mac, confidence, evidence_sources]
      properties:
        hostname:
          type: [string, 'null']
        ip:
          type: [string, 'null']
        mac:
          type: string
        device:
          oneOf:
            - $ref: '#/components/schemas/DeviceRef'
            - type: 'null'
        port:
          oneOf:
            - $ref: '#/components/schemas/PortRef'
            - type: 'null'
        vlan:
          type: [integer, 'null']
        confidence:
          type: string
          enum: [high, medium, low]
        last_seen:
          type: [string, 'null']
          format: date-time
        evidence_sources:
          type: array
          items:
            type: string
    AssetNetworkResponse:
      type: object
      required: [asset_id, endpoint]
      properties:
        asset_id:
          type: integer
        endpoint:
          $ref: '#/components/schemas/EndpointResolution'
    LibreNmsEvent:
      type: object
      required: [alert_id, device_id, hostname, state]
      properties:
        alert_id:
          type: integer
        rule_id:
          type: integer
          default: 0
        device_id:
          type: integer
        hostname:
          type: string
        severity:
          type: [string, 'null']
        state:
          oneOf:
            - type: string
            - type: integer
            - type: boolean
        timestamp:
          type: [string, 'null']
          format: date-time
        fault_object:
          type: [string, 'null']
        message:
          type: [string, 'null']
        raw:
          type: object
          additionalProperties: true
    EventAccepted:
      type: object
      required: [accepted, correlation_key, action]
      properties:
        accepted:
          type: boolean
        correlation_key:
          type: string
        glpi_ticket_id:
          type: [integer, 'null']
        action:
          type: string
          enum: [created, updated, recovered, ignored]
    Correlation:
      type: object
      required:
        - key
        - librenms_alert_id
        - glpi_ticket_id
        - state
        - created_at
        - updated_at
      properties:
        key:
          type: string
        librenms_alert_id:
          type: integer
        glpi_ticket_id:
          type: integer
        state:
          type: string
          enum: [open, recovered, closed]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
