name: Validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare CI environment
        run: |
          cp .env.example .env
          sed -i 's/CHANGE_ME_GLPI_DB_PASSWORD/CI_GLPI_DB_0123456789abcdef0123456789abcdef/' .env
          sed -i 's/CHANGE_ME_LIBRENMS_DB_PASSWORD/CI_LIBRENMS_DB_0123456789abcdef0123456789abcdef/' .env
          chmod 600 .env

      - name: Validate canonical stack and policies
        run: bash scripts/validate.sh

      - name: Ensure secret environment is not tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "ERROR: .env must never be committed"
            exit 1
          fi
